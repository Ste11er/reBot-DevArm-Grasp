camera:
  type: realsense_d405        # 实际接的是 RealSense D405 (USB: Intel 8086:0b5b)；orbbec_gemini2 未连接
  serial: null
  color_width: 1280           # D405 支持 1280x720@30 RGB-D（已实测）
  color_height: 720
  fps: 30

calibration:
  aruco:
    marker_length_m: 0.035
    dict_id: 0
    target_marker_id: 0
  hand_eye_method: TSAI
  # 手眼标定模式：
  #   eye_in_hand — 相机装在机械臂末端，随臂运动（标定板固定）
  #   eye_to_hand — 相机固定在桌面/基座（标定板装在末端随臂运动）
  hand_eye_mode: "eye_in_hand"
  hand_eye_compensation_m:
    x: 0.00
    y: 0.0
    z: -0.02

detection:
  conf_threshold: 0.5
  iou_threshold: 0.45

robot:
  repo_root: null
  gripper:
    dm:
      angle_open: 5.0
      counterclockwise: true
      tau_max: 1.5
      close_torque: 1.0
      default_force: 0.30
    rs:
      angle_open: 5.0
      counterclockwise: false
      tau_max: 1.5
      close_torque: 1.5
      default_force: 0.30
  ready_pose:
    x: 0.3
    y: 0.0
    z: 0.3
    roll: 0.0
    pitch: 0.7
    duration: 3.0

yolo:
  model_name: "yoloe-26l-seg.pt"
  device: "xpu"               # YOLO is compute-bound: Intel XPU is 3-5x faster than CPU
  use_world: true
  custom_classes:
    - "yellow banana"
    - "water bottle"
    - "light blue coffee cup"
    - "cup"
    - "green object"
    - "tool"

grasp_pipeline:
  infer_every_live: 3
  grasp:
    depth_quantile: 0.5
    pregrasp_offset_m: 0.080
    insertion_depth_m: 0.015
    min_base_z_m: 0.00

graspnet:
  checkpoint: "checkpoint-rs.tar"
  device: "cpu"               # launch-bound workload (batch=1, thousands of tiny kernels):
                              # CPU beats XPU here (~1.6s vs ~2.7s); "xpu"/"cuda" also work
  num_point: 20000
  collision_thresh: 0.01
  min_depth: 0.05
  max_depth: 1.0
  top_k: 50
  target_class: null
  target_margin_px: 12
  target_expand_ratio: 1.35
