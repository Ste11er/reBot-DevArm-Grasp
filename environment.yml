# Legacy conda environment (CUDA-oriented).
#
# NOTE: The primary supported setup is now uv + Intel XPU (torch 2.8.0+xpu).
# From the project root run:
#     uv sync
# which installs torch/torchvision/torchaudio from the PyTorch XPU index and
# resolves to Intel GPU (XPU) capable builds. See README section on XPU.
#
# This file is kept for reference / CUDA machines:
name: rebotarm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy<2.0
  - scipy>=1.10
  - pinocchio=3.9.0
  - matplotlib>=3.10.0
  - pyyaml>=6.0
  - pip
  - pip:
      - opencv-python==4.7.0.72
      - opencv-contrib-python==4.7.0.72
      - ultralytics==8.4.35
      - pyrealsense2>=2.54
      - meshcat>=0.3.2
      - motorbridge>=0.1.7
      - funasr==1.1.3
      - modelscope
      - torchaudio
      - soundfile
